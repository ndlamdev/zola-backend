[versions]
spring-boot = "3.5.4"
spring-dependency-management = "1.1.7"
kotlin = "1.9.25"

spring-cloud-gateway = "4.3.5"
spring-cloud-loadbalancer = "3.1.8"

lombok = "1.9.25"
flyway = "12.6.1"
mapstruct = "1.6.3"
redisson = "3.50.0"

r2dbc-mysql = "1.4.2"
libphonenumber = "9.0.9"
springdoc = "2.8.9"
commons-lang3 = "3.18.0"
kryo = "5.6.2"
uuid = "5.2.0"

reactor-kafka = "1.3.25"

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
lombok = { id = "org.jetbrains.kotlin.plugin.lombok", version.ref = "lombok" }

[libraries]

############################
# Spring Boot Starters
############################

spring-boot-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-data-r2dbc = { module = "org.springframework.boot:spring-boot-starter-data-r2dbc" }
spring-boot-data-redis-reactive = { module = "org.springframework.boot:spring-boot-starter-data-redis-reactive" }
spring-boot-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-rsocket = { module = "org.springframework.boot:spring-boot-starter-rsocket" }
spring-boot-websocket = { module = "org.springframework.boot:spring-boot-starter-websocket" }
spring-boot-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-data-mongodb = { module = "org.springframework.boot:spring-boot-starter-data-mongodb-reactive" }

############################
# Spring Cloud Starters
############################

spring-cloud-loadbalancer = { module = "org.springframework.cloud:spring-cloud-starter-loadbalancer", version.ref = "spring-cloud-loadbalancer" }
spring-cloud-gateway = { module = "org.springframework.cloud:spring-cloud-starter-gateway-server-webflux", version.ref = "spring-cloud-gateway" }

############################
# Spring
############################

spring-kafka = { module = "org.springframework.kafka:spring-kafka" }
spring-security-rsocket = { module = "org.springframework.security:spring-security-rsocket" }
spring-security-messaging = { module = "org.springframework.security:spring-security-messaging" }

############################
# Kotlin
############################

kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib" }
kotlin-coroutines-reactor = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-reactor" }

############################
# Reactor
############################

reactor-kotlin = { module = "io.projectreactor.kotlin:reactor-kotlin-extensions" }
reactor-kafka = { module = "io.projectreactor.kafka:reactor-kafka", version.ref = "reactor-kafka" }

############################
# Jackson
############################

jackson-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
jackson-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310" }

############################
# Kafka
############################

kafka-streams = { module = "org.apache.kafka:kafka-streams" }

############################
# Flyway
############################

flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-mysql = { module = "org.flywaydb:flyway-mysql", version.ref = "flyway" }

############################
# Database
############################

r2dbc-mysql = { module = "io.asyncer:r2dbc-mysql", version.ref = "r2dbc-mysql" }
mysql-driver = { module = "com.mysql:mysql-connector-j" }

############################
# Lombok
############################

lombok = { module = "org.projectlombok:lombok" }

############################
# MapStruct
############################

mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }

############################
# Redisson
############################

redisson = { module = "org.redisson:redisson", version.ref = "redisson" }
redisson-spring-data = { module = "org.redisson:redisson-spring-data-35", version.ref = "redisson" }

############################
# OpenAPI
############################

springdoc-webflux = { module = "org.springdoc:springdoc-openapi-starter-webflux-ui", version.ref = "springdoc" }

############################
# Utility
############################

commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
libphonenumber = { module = "com.googlecode.libphonenumber:libphonenumber", version.ref = "libphonenumber" }
kryo = { module = "com.esotericsoftware:kryo", version.ref = "kryo" }
uuid-generator = { module = "com.fasterxml.uuid:java-uuid-generator", version.ref = "uuid" }

############################
# Test
############################

spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
reactor-test = { module = "io.projectreactor:reactor-test" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }
testcontainers-mysql = { module = "org.testcontainers:mysql" }